name: Pacote da Microsoft Store

# Faz o Sinema-Store.msix (o pacote que se envia para a Microsoft Store: a Store assina-o) a partir de windows/lib,
# confirma num Windows que instala e arranca, e publica-o numa versão de pré-lançamento "store-v…" para descarregar.
on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/store.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: mpv (o leitor)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -match '^mpv-x86_64-\d+-git-[0-9a-f]+\.7z$' } | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv.7z
          7z x mpv.7z -ompv-all | Out-Null
          New-Item -ItemType Directory -Force windows/lib/mpv | Out-Null
          Copy-Item mpv-all/mpv.exe windows/lib/mpv/
          Get-ChildItem mpv-all -Filter *.dll | Copy-Item -Destination windows/lib/mpv/

      - name: Pacote MSIX
        shell: pwsh
        run: |
          $v = (Get-Content windows/version.txt -Raw).Trim()
          $parts = $v.Split('.') + @('0','0','0'); $msixVersion = ($parts[0..2] -join '.') + '.0'   # a Store quer x.y.z.0
          $id = Get-Content windows/store.json -Raw | ConvertFrom-Json
          jpackage --type app-image --name Sinema --app-version $v --vendor Sinema `
            --input windows/lib --main-jar sinema.jar --main-class dev.alder.desktop.MainKt --icon windows/lib/icon.ico `
            --java-options '-Dcompose.application.resources.dir=$APPDIR' --dest image
          Copy-Item -Recurse windows/store image/Sinema/store
          (Get-Content windows/AppxManifest.xml -Raw).Replace('@NAME@', $id.name).Replace('@PUBLISHER@', $id.publisher).
            Replace('@PUBLISHERNAME@', $id.publisherDisplayName).Replace('@VERSION@', $msixVersion) |
            Set-Content image/Sinema/AppxManifest.xml -Encoding utf8
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          $makepri = Join-Path $sdk.DirectoryName makepri.exe
          Push-Location image/Sinema
          & $makepri createconfig /cf priconfig.xml /dq pt-PT /o | Out-Null
          & $makepri new /pr . /cf priconfig.xml /mn AppxManifest.xml /of resources.pri /o
          Remove-Item priconfig.xml
          Pop-Location
          New-Item -ItemType Directory -Force out | Out-Null
          & $sdk.FullName pack /d image/Sinema /p out/Sinema-Store.msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx falhou" }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PUBLISHER=$($id.publisher)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SIGNTOOL=$(Join-Path $sdk.DirectoryName signtool.exe)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-Item out/Sinema-Store.msix | Format-List Name, Length

      - name: Confirmar que instala e arranca (cópia assinada só para o teste)
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject $env:PUBLISHER -KeyUsage DigitalSignature -FriendlyName "Sinema teste" `
            -CertStoreLocation Cert:\CurrentUser\My -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pwd = ConvertTo-SecureString -String "teste" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath teste.pfx -Password $pwd | Out-Null
          Export-Certificate -Cert $cert -FilePath teste.cer | Out-Null
          Import-Certificate -FilePath teste.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Copy-Item out/Sinema-Store.msix teste.msix
          & $env:SIGNTOOL sign /fd SHA256 /a /f teste.pfx /p teste teste.msix
          if ($LASTEXITCODE -ne 0) { throw "signtool falhou" }
          Add-AppxPackage teste.msix
          $p = Get-AppxPackage | Where-Object { $_.Name -eq ((Get-Content windows/store.json -Raw | ConvertFrom-Json).name) }
          if (-not $p) { throw "O pacote não ficou instalado" }
          Write-Host "Instalado: $($p.PackageFullName) em $($p.InstallLocation)"
          $env:SINEMA_HOME = "$env:RUNNER_TEMP\sinema-home"
          Start-Process "shell:AppsFolder\$($p.PackageFamilyName)!Sinema"
          Start-Sleep 25
          $proc = Get-Process | Where-Object { $_.Path -like "$($p.InstallLocation)*" }
          $proc | Format-Table Name, Id, Path -AutoSize
          $log = Get-ChildItem "$env:LOCALAPPDATA\Packages\$($p.PackageFamilyName)" -Recurse -Filter sinema.log -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) { Get-Content $log.FullName -Tail 20 }
          if (-not $proc) { throw "O Sinema não arrancou a partir do pacote" }
          & "$($p.InstallLocation)\app\mpv\mpv.exe" --version | Select-Object -First 1
          $proc | Stop-Process -Force

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: store-v${{ env.VERSION }}
          name: Sinema ${{ env.VERSION }} · pacote para a Microsoft Store
          prerelease: true
          make_latest: false
          body: |
            Pacote para enviar à Microsoft Store (Partner Center › Pacotes). Não serve para instalar diretamente: a Store assina-o depois da certificação.
          files: out/Sinema-Store.msix
